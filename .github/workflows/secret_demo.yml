name: Secret Demo
on:
  push:
    branches: [ "main" ]
jobs:
  use-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use API Key
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "API Key is securely available to this step"
          echo "Secret length: ${#API_KEY}"
          echo "output displayed successfully"
